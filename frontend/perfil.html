<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Perfil</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        

        <h1>Meu Perfil</h1>

        <input type="text" id="cpf" placeholder="CPF">

        <input type="text" id="rg" placeholder="RG">

        <input type="text" id="nome" placeholder="Nome">

        <input type="number" id="idade" placeholder="Idade">

        <input type="email" id="email" placeholder="Email">

        <input type="text" id="login" placeholder="Login">

        <input type="password" id="senha" placeholder="Nova senha">

        <button onclick="atualizarPerfil()">
            Atualizar Dados
        </button>

        <hr>

        <h2>Meus Pedidos</h2>

        <input type="text" id="descricaoPedido" placeholder="Descrição do pedido">

        <input type="number" id="quantidadePedido" placeholder="Quantidade">

        <button onclick="criarPedido()">
            Adicionar Pedido
        </button>

        <div id="listaPedidos"></div>

        <button onclick="logout()">
            Sair
        </button>

        <button onclick="voltarUsuarios()">
            Concluir
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
